<h2 class="heading" i18n="@@list.title">Tâches</h2>

<mat-chip-listbox
  class="people"
  multiple
  [value]="selected()"
  (change)="onSelectionChange($event.value)"
  i18n-aria-label="@@list.filterLabel"
  aria-label="Filtrer les tâches par personne"
>
  @for (m of members(); track m.id) {
    <mat-chip-option [value]="m.id">
      <span class="dot" [style.background-color]="m.couleur"></span>
      {{ m.nom }}
    </mat-chip-option>
  }
</mat-chip-listbox>

@if (groups().length === 0) {
  <p class="empty" i18n="@@list.empty">Aucune tâche sur cette période.</p>
} @else {
  <div class="groups">
    @for (group of groups(); track group.day.getTime()) {
      <section>
        <h3 class="day">{{ group.day | date: 'EEEE d MMMM' }}</h3>
        <ul class="entries">
          @for (entry of group.entries; track entry.id) {
            <li>
              <button
                type="button"
                class="entry"
                [class.cancelled]="entry.statut === 'ANNULE'"
                [style.border-left-color]="entryColor(entry)"
                (click)="entryClick.emit(entry)"
              >
                <span class="time">{{ entry.dateHeure | date: 'shortTime' }}</span>
                <span class="body">
                  <span class="title">{{ entry.titre }}</span>
                  <span class="meta">
                    {{ entry.type | enumLabel: 'type' }}
                    @for (m of entry.membres; track m.id) {
                      <span class="member">
                        <span class="dot" [style.background-color]="m.couleur"></span>{{ m.nom }}
                      </span>
                    }
                  </span>
                </span>
                <mat-icon class="status" [attr.title]="entry.statut | enumLabel: 'status'">
                  {{ statusIcons[entry.statut ?? 'PREVU'] }}
                </mat-icon>
              </button>
            </li>
          }
        </ul>
      </section>
    }
  </div>
}
