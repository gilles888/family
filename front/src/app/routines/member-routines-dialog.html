<h2 mat-dialog-title class="title">
  <app-avatar [member]="member" [size]="36" />
  <ng-container i18n="@@memberRoutines.title">Routines de {{ member.nom }}</ng-container>
</h2>

<mat-dialog-content>
  <app-routine-manager [member]="member" [members]="members" />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton mat-dialog-close i18n="@@common.close">Fermer</button>
</mat-dialog-actions>
