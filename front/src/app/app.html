<mat-toolbar class="header">
  <a class="brand" routerLink="/">
    <mat-icon>calendar_month</mat-icon>
    <span i18n="@@app.title">Agenda familial</span>
  </a>

  <nav>
    <a matButton routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <mat-icon class="nav-icon">event</mat-icon><span class="nav-label" i18n="@@nav.agenda">Agenda</span>
    </a>
    <a matButton routerLink="/routines" routerLinkActive="active">
      <mat-icon class="nav-icon">stars</mat-icon><span class="nav-label" i18n="@@nav.routines">Routines</span>
    </a>
    <a matButton routerLink="/recettes" routerLinkActive="active">
      <mat-icon class="nav-icon">menu_book</mat-icon><span class="nav-label" i18n="@@nav.recipes">Recettes</span>
    </a>
    <a matButton routerLink="/courses" routerLinkActive="active">
      <mat-icon class="nav-icon">shopping_cart</mat-icon><span class="nav-label" i18n="@@nav.shopping">Courses</span>
    </a>
    <a matButton routerLink="/membres" routerLinkActive="active">
      <mat-icon class="nav-icon">group</mat-icon><span class="nav-label" i18n="@@nav.members">Membres</span>
    </a>
  </nav>

  <span class="spacer"></span>

  <mat-button-toggle-group
    class="language"
    [value]="locale"
    (change)="switchLanguage($event.value)"
    hideSingleSelectionIndicator
    i18n-aria-label="@@app.language"
    aria-label="Langue"
  >
    @for (l of languages; track l.code) {
      <mat-button-toggle [value]="l.code" [attr.lang]="l.code" [title]="l.label">{{ l.code.toUpperCase() }}</mat-button-toggle>
    }
  </mat-button-toggle-group>
</mat-toolbar>

<main>
  <router-outlet />
</main>
