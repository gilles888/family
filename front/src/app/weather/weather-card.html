<h2 class="heading" i18n="@@weather.title">Comment s'habiller ?</h2>

@if (meteo.hasValue()) {
  <div class="days">
    @for (jour of meteo.value().jours ?? []; track jour.date; let first = $first) {
      <app-weather-day [day]="jour" [label]="first ? todayLabel : tomorrowLabel" [highlighted]="first" />
    }
  </div>
} @else if (meteo.error()) {
  <div class="error">
    <span i18n="@@weather.error">Météo indisponible pour le moment.</span>
    <button matButton (click)="meteo.reload()" i18n="@@common.retry">
      Réessayer
    </button>
  </div>
}
