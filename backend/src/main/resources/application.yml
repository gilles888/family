spring:
  application:
    name: family-agenda
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: ${APP_TIMEZONE:Europe/Paris}

agenda:
  generation:
    # Fenêtre d'AgendaEntry générées à l'avance pour les reminders récurrents
    horizon-months: ${AGENDA_HORIZON_MONTHS:6}
    # Job de prolongation (cron Spring, 6 champs) : chaque nuit à 02:00
    cron: ${AGENDA_EXTENSION_CRON:0 0 2 * * *}
  seed:
    enabled: false

meteo:
  # Le dépôt est public : ne pas committer les coordonnées du domicile, les passer par variables d'environnement.
  lieu: ${METEO_LIEU:Bruxelles}
  latitude: ${METEO_LATITUDE:50.85}
  longitude: ${METEO_LONGITUDE:4.35}
  fuseau: ${METEO_FUSEAU:Europe/Brussels}
  # Heure de départ à l'école : ressenti « du matin » et début de la fenêtre de risque de pluie
  heure-depart: ${METEO_HEURE_DEPART:8}
  cache: ${METEO_CACHE:30m}
  base-url: ${METEO_BASE_URL:https://api.open-meteo.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

---
# ===== Développement : H2 en mémoire + données de test (profil par défaut)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:familyagenda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

agenda:
  seed:
    enabled: true

logging:
  level:
    com.family.agenda: DEBUG

---
# ===== Production : PostgreSQL, configuration par variables d'environnement
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/family_agenda}
    username: ${DB_USERNAME:family}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # "update" crée/complète le schéma au démarrage. Pour une vraie prod, préférer Flyway/Liquibase + "validate".
      ddl-auto: ${DDL_AUTO:update}

agenda:
  seed:
    enabled: ${AGENDA_SEED_ENABLED:false}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
