# nginx de l'hôte pour l'agenda familial : HTTPS, en-têtes de sécurité, limitation de débit, journal dédié.
# Rendu (deploy/README.md) :
#   DOMAIN=famille.gilmotech.be HTTP_PORT=8090 envsubst '${DOMAIN} ${HTTP_PORT}' < nginx-famille.conf
# Installé dans /etc/nginx/sites-available/zz-${DOMAIN} (lien dans sites-enabled), toujours validé par
# « sudo nginx -t » avant « sudo systemctl reload nginx ». Préfixe zz- : sites-enabled est lu par ordre
# alphabétique et aucun site ne déclare default_server ; chargé en dernier, ce site ne devient pas le site par
# défaut des ports 80 / 443 à la place des sites existants.

# Limitation de débit par IP (zones propres à ce site : noms préfixés famille_)
limit_req_zone $binary_remote_addr zone=famille_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=famille_login:10m rate=5r/m;

# Port 80 : défi ACME (renouvellement Certbot) et redirection vers HTTPS, rien d'autre
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Sans http2 : avec nginx 1.24, « listen 443 ssl http2 » l'activerait pour TOUS les sites de l'adresse
    # 0.0.0.0:443 (Home Assistant, HygieneCheck). À ajouter avec « http2 on; » à partir de nginx 1.25.1.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DOMAIN};
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    # Profil TLS de Certbot (Mozilla « intermediate » : TLS 1.2 et 1.3), comme les autres sites du serveur
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/famille.access.log;
    error_log /var/log/nginx/famille.error.log;

    client_max_body_size 1m;
    limit_req_status 429;

    # En-têtes de sécurité (niveau server uniquement : un add_header dans une location les annulerait)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Build Angular : scripts du site seulement ; styles en ligne (styles de composants, polices intégrées au build) ;
    # polices Roboto / Material Icons chez Google ; la météo passe par le backend (/v1/meteo).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Vers le nginx du conteneur (127.0.0.1 seulement). X-Forwarded-For est ÉCRASÉ par l'IP vue ici :
    # un en-tête envoyé par le client ne peut pas falsifier l'IP des journaux AUTH_* du backend.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;

    # Connexion : 5 tentatives par minute et par IP (rafale de 5), au-delà 429
    location = /v1/auth/login {
        limit_req zone=famille_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:${HTTP_PORT};
    }

    location / {
        limit_req zone=famille_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:${HTTP_PORT};
    }
}
