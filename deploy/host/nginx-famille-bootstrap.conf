# nginx de l'hôte, ÉTAPE 1 (avant le certificat) : port 80 seulement, pour le défi ACME de Certbot (webroot).
# Rendu : DOMAIN=famille.gilmotech.be envsubst '${DOMAIN}' < nginx-famille-bootstrap.conf
# Remplacé par nginx-famille.conf une fois le certificat obtenu (voir deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
