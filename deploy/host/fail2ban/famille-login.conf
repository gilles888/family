# Filtre fail2ban : tentatives de connexion refusées (401) ou limitées (429) sur l'agenda familial,
# lues dans le journal du nginx de l'hôte (format « combined », vraie IP du client).
# À installer dans /etc/fail2ban/filter.d/famille-login.conf.
[Definition]
# fail2ban retire la date (« [24/Oct/2026:23:14:24 +0200] ») de la ligne avant d'appliquer l'expression :
# d'où le « .* » entre l'utilisateur distant et la requête.
failregex = ^<HOST> \S+ \S+ .*"POST /v1/auth/login(?:\?\S*)? HTTP/[^"]*" (?:401|429)\s
ignoreregex =
