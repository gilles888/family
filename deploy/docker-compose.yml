# Production : PostgreSQL + backend (jar) + nginx (front fr/nl, relais /v1).
# Installé et lancé par deploy.sh ; les valeurs viennent du fichier .env (voir .env.example).
# Seul nginx publie un port, et sur 127.0.0.1 uniquement : Docker contourne UFW, un port publié sur 0.0.0.0
# serait joignable depuis internet. HTTPS est assuré par le nginx de l'hôte (deploy/host/).
name: family

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_agenda
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      TZ: ${APP_TIMEZONE:-Europe/Brussels}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_agenda"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    # Java 25 (comme java.version du pom), version exacte : voir deploy/README.md « Mettre à jour Java »
    image: eclipse-temurin:25.0.4.1_1-jre-noble
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/family_agenda
      DB_USERNAME: family
      DB_PASSWORD: ${DB_PASSWORD}
      # Premier compte parent (base sans compte) ; vide après le premier déploiement
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AGENDA_COOKIE_SECURE: ${AGENDA_COOKIE_SECURE:-true}
      AGENDA_REMEMBER_ME_KEY: ${AGENDA_REMEMBER_ME_KEY:?AGENDA_REMEMBER_ME_KEY manquant dans .env}
      # true tant que le premier déploiement n'a pas réussi : deploy.sh s'en charge
      AGENDA_SEED_ENABLED: ${AGENDA_SEED_ENABLED:-false}
      AGENDA_SEED_FICHIER: /config/famille.json
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Brussels}
      TZ: ${APP_TIMEZONE:-Europe/Brussels}
      METEO_LIEU: ${METEO_LIEU:-Bruxelles}
      METEO_LATITUDE: ${METEO_LATITUDE:-50.85}
      METEO_LONGITUDE: ${METEO_LONGITUDE:-4.35}
      METEO_FUSEAU: ${APP_TIMEZONE:-Europe/Brussels}
      METEO_HEURE_DEPART: ${METEO_HEURE_DEPART:-8}
    volumes:
      - ./app:/app:ro
      # Dossier (et non fichier) : sans famille.json, Docker ne crée pas de dossier à sa place
      - ./config:/config:ro

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${HTTP_PORT:-8090}:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  pgdata:
