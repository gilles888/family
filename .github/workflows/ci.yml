# Tests du backend (Java 25) et du front (Angular, fr + nl) : à chaque push et pull request,
# et avant chaque déploiement (appelé par deploy.yml).
name: Tests

on:
  push:
    # Sur main, deploy.yml lance déjà ces tests avant de déployer
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp verify

  front:
    name: Front (tests + build fr/nl)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      # Build de production : échoue si une traduction nl manque
      - run: npm run build
